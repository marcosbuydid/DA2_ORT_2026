<div class="container">
  <div class="row justify-content-center align-items-center ">
    <div class="col-sm-8 col-md-6 col-lg-5 col-xl-4">
      <!-- <div class="card shadow-sm rounded-4 border-0" style="background: #ffffff;"> -->
        <div class="card-body p-5 text-center">
          <h3 class="mb-4 fw-bold text-dark">Add User</h3>

          @if (submitSuccess) {
            <div class="alert alert-success py-2">User created successfully!</div>
          }

          <form [formGroup]="addUserForm" (ngSubmit)="onSubmit()" class="mt-3">

            <div class="mb-3">
              <input type="text"
                     class="form-control rounded-3 border-secondary"
                     placeholder="Type the name"
                     formControlName="name"
                     [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
              <div *ngIf="submitted && f['name'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['name'].errors['required']">Name is required</div>
              </div>
            </div>

            <div class="mb-3">
              <input type="text"
                     class="form-control rounded-3 border-secondary"
                     placeholder="Type the last name"
                     formControlName="lastName"
                     [ngClass]="{ 'is-invalid': submitted && f['lastName'].errors }" />
              <div *ngIf="submitted && f['lastName'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['lastName'].errors['required']">Last name is required</div>
              </div>
            </div>

            <div class="mb-3">
              <input type="email"
                     class="form-control rounded-3 border-secondary"
                     placeholder="Type the email"
                     formControlName="email"
                     [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
              <div *ngIf="submitted && f['email'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['email'].errors['required']">Email is required</div>
                <div *ngIf="f['email'].errors['email']">Email is invalid</div>
              </div>
            </div>

            <div class="mb-3">
              <input type="password"
                     class="form-control rounded-3 border-secondary"
                     placeholder="Type the password"
                     formControlName="password"
                     [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
              <div *ngIf="submitted && f['password'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['password'].errors['required']">Password is required</div>
                <div *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</div>
              </div>
            </div>

            <div class="mb-4">
              <select class="form-select rounded-3 border-secondary"
                      formControlName="roleId"
                      [ngClass]="{ 'is-invalid': submitted && f['roleId'].errors }">
                <option [ngValue]="0" disabled>Select a role...</option>
                @for (role of roles; track role.id) {
                  <option [ngValue]="role.id">{{ role.name }}</option>
                }
              </select>
              <div *ngIf="submitted && f['roleId'].errors" class="invalid-feedback text-start">
                <div *ngIf="f['roleId'].errors['required'] || f['roleId'].errors['min']">Role is required</div>
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary rounded-3 shadow-sm">Save</button>
            </div>
            <div class="d-grid">
              <button type="button" class="btn btn-secondary rounded-3" (click)="onCancel()">Cancel</button>
            </div>

          </form>
        </div>
      <!-- </div> -->
    </div>
  </div>
</div>
