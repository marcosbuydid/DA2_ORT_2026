<div class="container">
    <div class="row justify-content-center align-items-center ">
        <div class="col-sm-8 col-md-6 col-lg-5 col-xl-4">
            <!-- <div class="card shadow-sm rounded-4 border-0" style="background: #ffffff;"> -->
            <div class="card-body p-5 text-center">
                <h3 class="mb-4 fw-bold text-dark">Edit Movie</h3>
                @if (submitSuccess) {
                <div class="alert alert-success py-2">Movie updated successfully!</div>
                }

                <form [formGroup]="editMovieForm" (ngSubmit)="onSubmit()" class="mt-3">

                    <div class="mb-3">
                        <input type="text" class="form-control rounded-3 border border-secondary" placeholder="Director"
                            formControlName="director"
                            [ngClass]="{ 'is-invalid': submitted && f['director'].errors }" />
                        <div *ngIf="submitted && f['director'].errors" class="invalid-feedback text-start">
                            <div *ngIf="f['director'].errors['required']">Director is required</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <input type="date" class="form-control rounded-3 border border-secondary"
                            formControlName="releaseDate"
                            [ngClass]="{ 'is-invalid': submitted && f['releaseDate'].errors }" />
                        <div *ngIf="submitted && f['releaseDate'].errors" class="invalid-feedback text-start">
                            <div *ngIf="f['releaseDate'].errors['required']">Release date is required</div>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary rounded-3 shadow-sm">Save</button>
                    </div>
                    <div class="d-grid">
                        <button type="button" class="btn btn-secondary rounded-3" (click)="onCancel()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
