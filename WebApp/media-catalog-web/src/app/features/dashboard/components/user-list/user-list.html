<div class="container mt-3">
    <h4>User List</h4>

    @if (loading) {
        <div class="d-flex justify-content-center mt-4">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    } 
    @else {
        @if (deleteUserAlertVisible) {
            <div class="alert alert-warning alert-dismissible fade show py-2" role="alert">
                <strong>User is logged in.</strong>
                <button type="button" class="btn-close py-2 mt-1" (click)="closedeleteUserAlert()"></button>
            </div>
        }
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>LastName</th>
                    <th>Email</th>
                    <th>RoleId</th>
                </tr>
            </thead>
            <tbody>
                @for (user of users; track user.id) {
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.name }}</td>
                    <td>{{ user.lastName }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.roleId }}</td>
                    <ng-container *ngIf="isAdmin$ | async">
                        <td class="text-end pe-5">
                            <button class="btn btn-success btn-sm" [routerLink]="['/dashboard/edit-user', user.email]">
                                Update
                            </button>
                        </td>
                    </ng-container>
                    <ng-container *ngIf="isAdmin$ | async">
                        <td class="text-end pe-5">
                            <button class="btn btn-danger btn-sm" (click)="deleteUser(user.email)">
                                Delete
                            </button>
                        </td>
                    </ng-container>
                </tr>
                } @empty {
                <tr>
                    <td colspan="2" class="text-center">No users found.</td>
                </tr>
                }
            </tbody>
        </table>
    }
</div>
